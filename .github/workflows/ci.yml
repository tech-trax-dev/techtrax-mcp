name: CI

on:
  pull_request:
  # Called by the CD workflow so a main push runs these checks once, instead of
  # CI and CD building the same commit twice in parallel.
  workflow_call:

jobs:
  build-test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-test
    # On main, cd.yml builds and pushes the real image — don't build it twice.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Validates the Dockerfile still builds end-to-end. PR images are throwaway,
      # so this never pushes; cd.yml owns publishing.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: techtrax/mcp-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
